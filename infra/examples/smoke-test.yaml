apiVersion: batch/v1
kind: Job
metadata:
  name: ml-release-platform-smoke-test
  labels:
    app: ml-release-platform-smoke-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: ml-release-platform-smoke-test
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduling-check
          image: public.ecr.aws/docker/library/busybox:1.37.0-musl
          command: ["/bin/sh", "-c", "echo EKS smoke test scheduled and completed"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi
